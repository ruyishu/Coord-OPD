# Pilot Experiment Configuration for Coord-OPD
# Draft resource assumption: 1x A800-class + 2x L20. Exact VRAM, usable card count
# and device map must be measured in M0 before any run consumes this file.

experiment:
  project: "coord-opd"
  name: "pilot_crop_nv_cot_8b"
  seed: 42
  max_crops_per_turn: 2

hardware:
  student_device: "cuda:0"   # A800: Student training & rollout
  teacher_device: "cuda:1"   # L20: Frozen Teacher scoring & continuous head
  dtype: "bfloat16"

model:
  # IDs from the pinned upstream README. No pre-RL NV-CoT checkpoint is released,
  # so the student starts from the README base model (continuous head initialized
  # by upstream load_policy); the teacher repo ships visual_refiner.safetensors.
  student_model_path: "Qwen/Qwen3-VL-8B-Instruct"
  teacher_model_path: "kesenZhaoNTU/NVCoT-Qwen3-VL-8B-Joint-GRPO-Step32"
  hidden_size: 4096
  fixed_sigma: 0.15
  use_lora: true
  lora_r: 16
  lora_alpha: 32

data:
  dataset_name: "DeepEyes-Datasets-47k"
  eval_benchmark: "vstar_bench"
  num_pilot_samples: 1500
  num_dev_samples: 300
  max_image_resolution: [1024, 1024]

opd:
  lambda_coord: 1.0          # weight for continuous coordinate Reverse KL
  residual_scale: 0.15        # upstream rollout.py: residual = 0.15 * tanh(raw)
  residual_transform: "tanh"  # doc-only: hardcoded in eval_regions.py, not read from config
  min_box_size: 0.02          # upstream sanitize min box side (eval_regions `min_size`)
  text_box_unit: 1000         # doc-only: hardcoded /1000 in eval_regions.text_box_to_coarse
  temperature: 1.0

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate_backbone: 1.0e-5
  learning_rate_refiner: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  num_updates: 50            # milestone M4 check: 50 updates
